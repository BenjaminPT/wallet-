name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node test/icons.mjs
      - run: npm test
      - run: npm run build
      - name: UI smoke test + screenshots
        run: node test/shots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
      - name: Package archive
        run: |
          mkdir -p pkg/noir-wallet
          cp -r dist pkg/noir-wallet/app
          cp server/server.mjs Dockerfile pkg/noir-wallet/
          cp launch/* pkg/noir-wallet/
          cp README.md TELEGRAM.md pkg/noir-wallet/ || true
          mkdir -p pkg/noir-wallet/telegram && cp telegram/setup-bot.mjs pkg/noir-wallet/telegram/
          chmod +x pkg/noir-wallet/*.sh pkg/noir-wallet/*.command
          (cd pkg && zip -qr ../noir-wallet.zip noir-wallet)
          cp dist/single.html noir-wallet-single.html
      - uses: actions/upload-artifact@v4
        with:
          name: noir-wallet
          path: |
            noir-wallet.zip
            noir-wallet-single.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest noir-wallet.zip noir-wallet-single.html --title "Noir Wallet" --notes "Архив (сервер на ПК/Mac) и автономный HTML. Сайт: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
